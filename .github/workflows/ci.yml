name: CI

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - '**'

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.21.0]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: |
                  npm run lint --workspace=web-ui

            - name: Run unit tests
              run: npm test --workspaces

            - name: Create build
              run: npm run build --workspaces

            - uses: actions/upload-artifact@v4
              with:
                  name: nlsolver
                  path: packages/nlsolver/dist/

            - uses: actions/upload-artifact@v4
              with:
                  name: web-ui
                  path: packages/web-ui/dist/

    publish_npm_nlsolver:
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build_and_test]
        environment:
            name: npm-nlsolver # manual approval
            url: https://www.npmjs.com/package/@zazzik/nlsolver
        strategy:
            matrix:
                node-version: [24.21.0]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - uses: actions/download-artifact@v4
              with:
                  name: nlsolver
                  path: ./packages/nlsolver/dist

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: 'https://registry.npmjs.org'

            - name: Publish to npm
              run: |
                  cd packages/nlsolver
                  npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    publish_gh_pages:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        needs: [build_and_test]
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: web-ui
                  path: _site

            - name: Upload gh pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
